    <!-- Main Content -->
    <main>
      <section>
        <h2>Select Your Year / Semester</h2>

        <p>Choose your year or semester to explore your study resources.</p>

        <form action="resources.html" method="get">
          <!-- Year Selection -->
          <label for="year">Select Year:</label>

          <select id="year" name="year" required>
            <option value="">-- Choose Year --</option>
            <option value="Year-1">First Year</option>
            <option value="Year-2">Second Year</option>
            <option value="Year-3">Third Year</option>
          </select>


          <!-- Sem Selection -->
          <label for="semester">Select Semester:</label>

          <select id="semester" name="semester" required>
            <option value="">-- Choose Semester --</option>
            <option value="Sem-1">Semester 1</option>
            <option value="Sem-2">Semester 2</option>
            <option value="Sem-3">Semester 3</option>
            <option value="Sem-4">Semester 4</option>
            <option value="Sem-5">Semester 5</option>
            <option value="Sem-6">Semester 6</option>
          </select>

          <br /><br />

          <button type="submit">Find Resources</button>
        </form>
      </section>
